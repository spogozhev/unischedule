<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Сводное расписание</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <header class="header">
        <div class="header-content">
            <h1 class="header-title">Сводное расписание</h1>
        </div>
    </header>

    <div class="toolbar">
        <div class="week-selector">
            <button class="btn btn-icon" id="btn-prev-week" title="Предыдущая неделя">&larr;</button>
            <span class="week-label" id="week-label"></span>
            <button class="btn btn-icon" id="btn-next-week" title="Следующая неделя">&rarr;</button>
            <button class="btn btn-secondary" id="btn-today">Сегодня</button>
        </div>
        <button class="btn btn-primary" id="btn-add-column">+ Добавить столбец</button>
    </div>

    <div class="timetable-wrapper">
        <table class="timetable" id="timetable">
            <thead>
                <tr id="timetable-header">
                    <th class="day-column-header">День</th>
                </tr>
            </thead>
            <tbody id="timetable-body"></tbody>
        </table>
        <div class="empty-state" id="empty-state">
            <p>Нажмите «+ Добавить столбец», чтобы добавить группу, аудиторию или преподавателя</p>
        </div>
    </div>

    <div class="modal-overlay" id="modal-overlay">
        <div class="modal" id="modal">
            <div class="modal-header">
                <h2 class="modal-title">Добавить столбец</h2>
                <button class="btn-close" id="btn-modal-close">&times;</button>
            </div>
            <div class="modal-tabs">
                <button class="tab active" data-tab="group">Группа</button>
                <button class="tab" data-tab="room">Аудитория</button>
                <button class="tab" data-tab="teacher">Преподаватель</button>
            </div>
            <div class="modal-body">
                <div class="mode-selector" id="mode-selector" style="display: none;">
                    <button class="mode-btn active" data-mode="quick">Быстрый поиск</button>
                    <button class="mode-btn" data-mode="step">Пошаговый выбор</button>
                </div>
                <div class="breadcrumbs" id="breadcrumbs"></div>
                <div class="search-box" id="search-box">
                    <input type="text" class="search-input" id="search-input" placeholder="Поиск..." autocomplete="off">
                    <span class="search-spinner" id="search-spinner"></span>
                </div>
                <div class="search-results" id="search-results"></div>
            </div>
        </div>
    </div>

    <script src="js/api.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
