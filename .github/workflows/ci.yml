name: CI

on:
  push:
    branches: [ "master" ]
  pull_request:
  
  workflow_dispatch:

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: JS syntax check
        run: for f in js/*.js; do node --check "$f"; done

      - name: Python lint
        run: |
          pip install ruff
          ruff check scripts/

      - name: Validate groups.json
        run: python -m json.tool groups.json > /dev/null     
